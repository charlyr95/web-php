<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alta de Categoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>
    <div class="d-flex flex-column align-items-center justify-content-center vh-100">
        <div class="card shadow" style="min-width: 400px; max-width: 500px;">
            <div class="card-header bg-success text-center">
                <h3 class="card-title mb-0 text-white">
                    <i class="fas fa-plus-circle me-2"></i>
                    Nueva Categoría
                </h3>
            </div>
            <div class="card-body">
                <p class="card-text text-center mb-4 text-muted">
                    Complete el siguiente formulario para agregar una nueva categoría al sistema.
                </p>
                
                <!-- Contenedor de alertas -->
                <div id="alertContainer"></div>
                
                <form id="formCategoria">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            <i class="fas fa-tag me-1"></i>
                            Nombre de la Categoría
                        </label>
                        <input type="text" 
                               class="form-control" 
                               id="nombre" 
                               name="nombre" 
                               placeholder="Ingrese el nombre de la categoría" 
                               required 
                               minlength="2" 
                               maxlength="100"
                               autocomplete="off">
                        <div class="form-text">
                            <i class="fas fa-info-circle me-1"></i>
                            Mínimo 2 caracteres, máximo 100
                        </div>
                        <div class="invalid-feedback" id="nombreError"></div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg" id="btnGuardar">
                            <span id="btnText">
                                <i class="fas fa-save me-2"></i>
                                Guardar Categoría
                            </span>
                            <span id="btnSpinner" class="d-none">
                                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                                Guardando...
                            </span>
                        </button>
                        
                        <div class="row g-2">
                            <div class="col">
                                <button type="reset" class="btn btn-outline-dark w-100" id="btnLimpiar">
                                    <i class="fas fa-eraser me-2"></i>
                                    Limpiar
                                </button>
                            </div>
                            <div class="col">
                                <a href="lista_categorias.html" class="btn btn-outline-success w-100">
                                    <i class="fas fa-list me-2"></i>
                                    Ver Lista
                                </a>
                            </div>
                        </div>
                        
                        <a href="../../index.php" class="btn btn-outline-dark">
                            <i class="fas fa-home me-2"></i>
                            Volver al Inicio
                        </a>
                    </div>
                </form>
            </div>
        </div>
        <footer class="mt-4 w-100">
            <p class="text-center mb-0">Carlos Romero</p>
        </footer>
    </div>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <script>
        $(document).ready(function() {
            // Event listeners
            $('#formCategoria').on('submit', handleSubmit);
            $('#btnLimpiar').on('click', limpiarFormulario);
            $('#nombre').on('input', validarNombreEnTiempoReal);
            
            // Enfocar el campo nombre al cargar
            $('#nombre').focus();
        });
        
        /**
         * Manejar envío del formulario
         */
        function handleSubmit(e) {
            e.preventDefault();
            
            const nombre = $('#nombre').val().trim();
            
            // Validaciones del lado cliente
            if (!validarNombre(nombre)) {
                return;
            }
            
            // Deshabilitar formulario y mostrar loading
            setLoading(true);
            
            // Preparar datos para envío
            const data = {
                nombre: nombre
            };
            
            // Enviar petición AJAX al controlador
            $.ajax({
                url: '../categorias.php',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(response) {
                    setLoading(false);
                    
                    if (response.success) {
                        mostrarAlerta(
                            `${response.message}`, 
                            'success'
                        );
                        
                        // Limpiar formulario sin ocultar la alerta de éxito
                        limpiarFormularioSinAlert();

                    } else {
                        mostrarAlerta(
                            `${response.message}`, 
                            'danger'
                        );
                        $('#nombre').focus();
                    }
                },
                error: function(xhr, status, error) {
                    setLoading(false);
                    
                    let errorMessage = 'Error de conexión al servidor';
                    
                    if (xhr.responseJSON) {
                        errorMessage = xhr.responseJSON.message || errorMessage;
                    } else if (xhr.status === 0) {
                        errorMessage = 'No se puede conectar al servidor. Verifique su conexión.';
                    } else if (xhr.status === 404) {
                        errorMessage = 'Servicio no encontrado (Error 404)';
                    } else if (xhr.status === 500) {
                        errorMessage = 'Error interno del servidor (Error 500)';
                    } else if (xhr.status === 409) {
                        errorMessage = 'Ya existe una categoría con ese nombre';
                    }
                    
                    mostrarAlerta(
                        `${errorMessage}`, 
                        'danger'
                    );
                    $('#nombre').focus();
                }
            });
        }
        
        /**
         * Validar nombre de categoría
         */
        function validarNombre(nombre) {
            const nombreField = $('#nombre');
            const errorDiv = $('#nombreError');
            
            // Limpiar estados previos
            nombreField.removeClass('is-invalid is-valid');
            errorDiv.text('');
            
            if (!nombre) {
                mostrarErrorCampo(nombreField, errorDiv, 'El nombre es requerido');
                return false;
            }
            
            if (nombre.length < 2) {
                mostrarErrorCampo(nombreField, errorDiv, 'El nombre debe tener al menos 2 caracteres');
                return false;
            }
            
            if (nombre.length > 100) {
                mostrarErrorCampo(nombreField, errorDiv, 'El nombre no puede exceder 100 caracteres');
                return false;
            }
            
            // Validar caracteres especiales básicos
            const regex = /^[a-zA-ZÀ-ÿ0-9\s\-_.()]+$/;
            if (!regex.test(nombre)) {
                mostrarErrorCampo(nombreField, errorDiv, 'El nombre contiene caracteres no válidos');
                return false;
            }
            
            // Campo válido
            nombreField.addClass('is-valid');
            return true;
        }
        
        /**
         * Validación en tiempo real del nombre
         */
        function validarNombreEnTiempoReal() {
            const nombre = $(this).val().trim();
            
            if (nombre.length > 0) {
                validarNombre(nombre);
            } else {
                $(this).removeClass('is-invalid is-valid');
                $('#nombreError').text('');
            }
            
            // Limpiar alertas mientras escribe
            $('.alert').fadeOut();
        }
        
        /**
         * Mostrar error en campo específico
         */
        function mostrarErrorCampo(field, errorDiv, mensaje) {
            field.addClass('is-invalid');
            errorDiv.text(mensaje);
            field.focus();
        }
        
        /**
         * Limpiar formulario
         */
        function limpiarFormulario() {
            $('#formCategoria')[0].reset();
            $('#nombre').removeClass('is-invalid is-valid');
            $('#nombreError').text('');
            $('.alert').fadeOut();
            $('#nombre').focus();
        }
        
        /**
         * Limpiar formulario sin ocultar alertas (para después de envío exitoso)
         */
        function limpiarFormularioSinAlert() {
            $('#formCategoria')[0].reset();
            $('#nombre').removeClass('is-invalid is-valid');
            $('#nombreError').text('');
            $('#nombre').focus();
        }
        
        /**
         * Manejar estado de carga
         */
        function setLoading(loading) {
            if (loading) {
                $('#btnGuardar').prop('disabled', true);
                $('#btnText').addClass('d-none');
                $('#btnSpinner').removeClass('d-none');
                $('#nombre').prop('disabled', true);
                $('#btnLimpiar').prop('disabled', true);
            } else {
                $('#btnGuardar').prop('disabled', false);
                $('#btnText').removeClass('d-none');
                $('#btnSpinner').addClass('d-none');
                $('#nombre').prop('disabled', false);
                $('#btnLimpiar').prop('disabled', false);
            }
        }
        
        /**
         * Mostrar alertas
         */
        function mostrarAlerta(mensaje, tipo) {
            const iconos = {
                'success': 'fas fa-check-circle',
                'danger': 'fas fa-exclamation-triangle',
                'warning': 'fas fa-exclamation-circle',
                'info': 'fas fa-info-circle'
            };
            
            const alerta = `
                <div class="alert alert-${tipo} alert-dismissible fade show" role="alert">
                    <i class="${iconos[tipo]} me-2"></i>
                    ${mensaje}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            
            $('#alertContainer').html(alerta);
            
            // Auto-ocultar alertas de éxito después de 8 segundos (más tiempo para leer)
            if (tipo === 'success') {
                setTimeout(function() {
                    $('.alert').fadeOut();
                }, 8000);
            }
            
            // Scroll al top para mostrar la alerta
            $('html, body').animate({
                scrollTop: $('#alertContainer').offset().top - 20
            }, 300);
        }
        
        /**
         * Prevenir envío accidental con Enter múltiple
         */
        let submitInProgress = false;
        $('#formCategoria').on('submit', function(e) {
            if (submitInProgress) {
                e.preventDefault();
                return false;
            }
            submitInProgress = true;
            
            // Resetear flag después de 3 segundos
            setTimeout(function() {
                submitInProgress = false;
            }, 3000);
        });
        
        /**
         * Shortcut: Ctrl+Enter para enviar
         */
        $(document).on('keydown', function(e) {
            if (e.ctrlKey && e.keyCode === 13) {
                $('#formCategoria').submit();
            }
        });
        
        /**
         * Shortcut: Escape para limpiar
         */
        $(document).on('keydown', function(e) {
            if (e.keyCode === 27) {
                limpiarFormulario();
            }
        });
    </script>
</body>
</html>
